name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build all Minecraft versions
        run: ./gradlew buildAndCollect --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: lightlite-jars
          path: build/libs/*/*.jar
          if-no-files-found: error

  gametest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run client gametest (${{ matrix.minecraft }})
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :${{ matrix.minecraft }}:runClientGameTest --stacktrace

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: gametest-${{ matrix.minecraft }}
          path: |
            run/screenshots/
            run/logs/latest.log
          if-no-files-found: ignore
