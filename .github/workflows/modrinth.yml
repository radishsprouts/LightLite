name: Modrinth

# Uploads the jars of an existing GitHub release to Modrinth, one Modrinth version per
# Minecraft version. Called by release.yml after publishing, or run by hand for an older tag.
# Needs the MODRINTH_TOKEN secret and the MODRINTH_PROJECT_ID variable; skips without them.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag to upload, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      API: https://api.modrinth.com/v2
      UA: radishsprouts/LightLite (GitHub Actions)
    steps:
      - name: Check settings
        id: check
        run: |
          if [ -z "$MODRINTH_TOKEN" ] || [ -z "$MODRINTH_PROJECT" ]; then
            echo "::notice::Modrinth upload skipped: set the MODRINTH_TOKEN secret and the MODRINTH_PROJECT_ID variable to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release jars
        if: steps.check.outputs.enabled == 'true'
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --dir jars

      - name: Upload to Modrinth
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # The variable may hold the slug; version creation needs the project ID
          # (a draft project is only visible with the token)
          auth=(-H "User-Agent: $UA" -H "Authorization: $MODRINTH_TOKEN")
          project_id=$(curl -fsS "${auth[@]}" "$API/project/$MODRINTH_PROJECT" | jq -r .id)
          existing=$(curl -fsS "${auth[@]}" "$API/project/$project_id/version" | jq -r '.[].version_number')

          case "$TAG" in v0.*) version_type=beta ;; *) version_type=release ;; esac
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          changelog=$(printf 'Changes / 変更点: %s\n\nSource / ソース: %s' \
            "https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md" "$release_url")

          shopt -s nullglob
          jars=(jars/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "::error::No jars attached to release $TAG"
            exit 1
          fi
          for jar in "${jars[@]}"; do
            # lightlite-<mod version>+<minecraft version>.jar
            version=$(basename "$jar" .jar)
            version=${version#lightlite-}
            mc=${version##*+}
            if grep -qxF "$version" <<< "$existing"; then
              echo "::notice::$version is already on Modrinth, skipped"
              continue
            fi
            jq -n \
              --arg project_id "$project_id" \
              --arg version "$version" \
              --arg mc "$mc" \
              --arg type "$version_type" \
              --arg changelog "$changelog" \
              '{
                project_id: $project_id,
                name: "LightLite \($version)",
                version_number: $version,
                changelog: $changelog,
                game_versions: [$mc],
                loaders: ["fabric"],
                version_type: $type,
                featured: true,
                dependencies: [
                  {project_id: "P7dR8mSH", dependency_type: "required"},
                  {project_id: "mOgUt4GM", dependency_type: "optional"}
                ],
                file_parts: ["file"],
                primary_file: "file"
              }' > data.json
            status=$(curl -sS -o response.json -w '%{http_code}' -X POST "$API/version" \
              "${auth[@]}" \
              -F "data=<data.json;type=application/json" \
              -F "file=@$jar;type=application/java-archive")
            if [ "$status" != 200 ]; then
              echo "::error::Modrinth rejected $version (HTTP $status): $(cat response.json)"
              exit 1
            fi
            echo "Uploaded $version: https://modrinth.com/mod/$project_id/version/$(jq -r .id response.json)"
          done
